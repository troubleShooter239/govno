[workspace]
members = ["crates/core", "crates/runtime", "apps/sandbox"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
govno-core = { path = "crates/core" }
govno-runtime = { path = "crates/runtime" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

