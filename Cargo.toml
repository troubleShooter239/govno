[workspace]
members = ["crates/render-graph", "crates/ecs", "crates/assets", "crates/core", "crates/input", "crates/scene", "crates/runtime", "apps/sandbox", "crates/platform", "crates/render", "crates/render-vulkan"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
description = "Game Optimized Vulkan-based Next-gen & Open Engine: a modular Rust 3D game engine"
repository = "https://github.com/troubleShooter239/govno"
keywords = ["gamedev", "game-engine", "vulkan", "rendering", "ecs"]
categories = ["game-engines", "graphics", "rendering"]

[workspace.metadata.project]
name = "GOVNO"

[workspace.dependencies]
govno-render-graph = { path = "crates/render-graph" }
govno-ecs = { path = "crates/ecs" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
rapier3d = "0.36.1"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
egui-ash-renderer = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
govno-scene = { path = "crates/scene" }
glam = "0.34"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
govno-platform = { path = "crates/platform" }
govno-input = { path = "crates/input" }
govno-render = { path = "crates/render" }
govno-render-vulkan = { path = "crates/render-vulkan" }
ash = "0.38"
ash-window = "0.13"
winit = "0.30"
raw-window-handle = { version = "0.6", features = ["std"] }
govno-core = { path = "crates/core" }
govno-runtime = { path = "crates/runtime" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
