[package]
name = "govno-render-vulkan"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
gpu-allocator.workspace = true
glam.workspace = true
govno-core.workspace = true
govno-render.workspace = true
ash.workspace = true
ash-window.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
serde_json = "1"

# Vulkan FFI is isolated here; other crates inherit forbid(unsafe_code).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
